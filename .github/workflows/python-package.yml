# Install the package with pip and run the test suite on every push and pull request.

name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui,dev]"
      - name: Syntax and undefined names
        run: |
          python -m pip install flake8
          flake8 primerJinn tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test
        run: python -m pytest tests -q
